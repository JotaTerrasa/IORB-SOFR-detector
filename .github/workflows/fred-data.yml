name: Refresh verified FRED data
on:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [fix/fred-production]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fred-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-feed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/update-fred.mjs
      - name: Publish changed observations
        run: |
          if git diff --quiet -- data/fred-snapshot.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fred-snapshot.json
          git commit -m 'Refresh verified FRED observations'
          git push origin HEAD:data-feed
